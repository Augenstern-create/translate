name: real-model

# 真实模型任务：**故意不在默认门禁里**。
# 原因（ADR-040）：模型权重的再分发许可未确认，仓库不存权重、CI 不下载权重、制品不缓存权重。
# 因此这个 workflow 只能在**已经有本机权重与 native 二进制的自托管 runner** 上跑，手动触发。
#
# 需要在该 runner 上预置（或由运维注入）：
#   NMT_BERGAMOT_BIN  Bergamot CLI 绝对路径
#   NMT_MODEL_DIR     含 5 个模型文件的目录
#   LD_LIBRARY_PATH   指向 libruntime 依赖（如 openblas-pthread）
#
# 前置不满足时**快速失败并给出可执行的提示**，而不是"悄悄跳过然后显示绿色"。

on:
  workflow_dispatch:
    inputs:
      bench_n:
          description: "热翻译样本数（默认 100）"
          required: false
          default: "100"
      skip_bench:
        description: "只跑测试、不跑基准"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: real-model-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NMT_SNAPSHOT_ROOT: /tmp/p3_snapshots_ci

jobs:
  real-model:
    name: 真实 Bergamot（自托管）
    runs-on: [self-hosted, linux, x64, nmt]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 前置检查（缺什么就说缺什么）
        run: |
          set -euo pipefail
          fail=0
          if [ -z "${NMT_BERGAMOT_BIN:-}" ] || [ ! -x "${NMT_BERGAMOT_BIN}" ]; then
            echo "::error::NMT_BERGAMOT_BIN 未设置或不可执行。构建见 tools/p3/build-bergamot.sh"
            fail=1
          fi
          if [ -z "${NMT_MODEL_DIR:-}" ] || [ ! -d "${NMT_MODEL_DIR}" ]; then
            echo "::error::NMT_MODEL_DIR 未设置或不存在。坐标见 fixtures/nmt/models.lock.json"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "真实模型任务需要本机权重与 native 二进制；它们不入库、不可由 CI 代下载（发行红线）。"
            exit 1
          fi
          echo "NMT_BERGAMOT_BIN=$NMT_BERGAMOT_BIN"
          echo "NMT_MODEL_DIR=$NMT_MODEL_DIR"

      - name: 权重哈希核对
        working-directory: translator-sdk
        run: python3 tools/check-release.py --verbose

      - name: 构建（debug worker + release bench）
        working-directory: translator-sdk
        run: |
          cargo build --workspace --all-features
          cargo build --release -p p33-bench
          cargo build --release -p translator-runtime --bin nmt-worker

      - name: 默认测试也要跑（防止真实 feature 掩盖默认路径的问题）
        working-directory: translator-sdk
        run: cargo test --workspace --all-features --locked

      - name: 真实模型测试（#[ignore]，串行）
        working-directory: translator-sdk
        env:
          NMT_WORKER_BIN: ${{ github.workspace }}/translator-sdk/target/debug/nmt-worker
        run: cargo test --workspace --all-features --locked -- --ignored --test-threads=1

      - name: 性能与质量基线
        if: ${{ inputs.skip_bench == false }}
        working-directory: translator-sdk
        env:
          NMT_WORKER_BIN: ${{ github.workspace }}/translator-sdk/target/release/nmt-worker
          N: ${{ inputs.bench_n }}
        run: |
          mkdir -p /tmp/gate
          ./target/release/p33-bench load --out /tmp/gate/load.json
          ./target/release/p33-bench nmt --n "$N" --out /tmp/gate/nmt.json
          ./target/release/p33-bench unload --out /tmp/gate/unload.json
          ./target/release/p33-bench quality --golden fixtures/nmt/golden-v1.jsonl --out /tmp/gate/quality.json

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-results
          path: /tmp/gate/*.json
          if-no-files-found: warn
