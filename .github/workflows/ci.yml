name: ci

# 默认门禁：不需要模型权重、不需要 native 二进制、不需要网络密钥。
# 真实转发站/本地模型的验证在本地手工执行（见 docs/testing.md）。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: 格式 / 静态检查 / 测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            translator-sdk/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('translator-sdk/Cargo.lock') }}

      - name: 格式检查
        run: cargo fmt --all -- --check
        working-directory: translator-sdk

      - name: Clippy（警告即失败）
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: translator-sdk

      - name: 单元 + 集成测试
        run: cargo test --workspace --no-fail-fast
        working-directory: translator-sdk

      - name: 文档构建
        run: cargo doc --workspace --no-deps
        working-directory: translator-sdk
        env:
          RUSTDOCFLAGS: -D warnings

      - name: 秘密信息扫描
        run: |
          if grep -rInE "(sk-[A-Za-z0-9]{16,}|api[_-]?key[[:space:]]*=[[:space:]]*\"[^\"]{8,}\")" \
               --include="*.rs" --include="*.toml" --include="*.json" --include="*.md" .; then
            echo "发现疑似密钥，请移除后再提交"
            exit 1
          fi
          echo "未发现硬编码密钥"
