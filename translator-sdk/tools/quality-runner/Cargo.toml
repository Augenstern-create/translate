[package]
name = "quality-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "T5: 批量翻译/查词质量运行器（JSONL 输入输出，不参与默认构建）"

[features]
default = []
# 真实 ORT 模型（Linux / Windows 均可；需要模型目录）
ort = ["translator-api/nmt-ort-runtime"]

[dependencies]
translator-api = { workspace = true, features = ["dictionary", "rules"] }
translator-analysis.workspace = true
translator-types.workspace = true
pollster.workspace = true
serde_json.workspace = true

[[bin]]
name = "quality-runner"
path = "src/main.rs"
