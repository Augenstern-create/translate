[package]
name = "translator-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "面向宿主程序的翻译 SDK：装配后端、术语表、模板与缓存"

[features]
default = []
# 把 Mock 插件透传给下游（测试/示例用）
mocks = ["translator-plugin-api/mocks"]

[dependencies]
translator-types.workspace = true
translator-plugin-api.workspace = true
translator-core.workspace = true
translator-http.workspace = true
translator-dictionary.workspace = true
translator-rules.workspace = true

[dev-dependencies]
translator-plugin-api = { workspace = true, features = ["mocks"] }
# 测试要造真实词典包
pack-dictionary.workspace = true
pollster.workspace = true
serde_json.workspace = true
tempfile.workspace = true
