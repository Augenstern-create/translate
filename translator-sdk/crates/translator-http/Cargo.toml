[package]
name = "translator-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "OpenAI 兼容 Chat Completions 翻译后端（远程转发站 / 本地模型服务）"

[dependencies]
translator-types = { workspace = true }
translator-plugin-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
# 同步 HTTP 客户端 + rustls（ring provider）。选它是因为：
# 1) 不引入 async runtime（SDK 至今没有 tokio/async-std 依赖）；
# 2) Windows / Linux 同一套代码，无系统 OpenSSL 依赖；
# 3) 阻塞调用由本 crate 的 worker 线程桥接成 Future，不阻塞宿主执行器。
ureq = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
