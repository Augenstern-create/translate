# 复制为 translate.toml 后按需修改。
# 密钥永远不写在这里：只写环境变量名（api_key_env）。
#
#   export TRANSLATE_API_KEY=...        # Linux / macOS
#   setx TRANSLATE_API_KEY "..."        # Windows
#
# 配置文件里出现真实密钥属于严重安全问题（见 AGENTS.md §6）。

# ---------- 可选数据文件（相对路径或绝对路径） ----------
# glossary   = "glossary.json"
# templates  = "templates.json"
# dictionary = "resources/dict"
# rules      = "rules.bin"

# ---------- 远程转发站 / 云端模型 ----------
[backend.remote]
enabled = true
base_url = "https://your-relay.example/v1"
model = "configured-model-id"
# 部署版本：远程服务可能在别名不变时替换模型，缓存身份需要它
model_revision = "2026-11-01"
api_key_env = "TRANSLATE_API_KEY"
timeout_ms = 30000
connect_timeout_ms = 5000
max_output_tokens = 2048
temperature = 0.0
max_retries = 2
max_concurrent_requests = 4
# 关闭"思考"（可选）：不同服务字段不同，不能靠猜
disable_thinking = false
thinking_style = "none"          # none | chat_template | reasoning_effort | thinking_type
# extra_body = { top_p = 0.9 }   # 供应商特有字段

# ---------- 自部署本地模型（同一套 HTTP 代码） ----------
[backend.local]
enabled = false
base_url = "http://127.0.0.1:8080/v1"
model = "local-translation-model"
api_key_env = ""
model_revision = "llama.cpp-local"

# ---------- 行为 ----------
[translation]
mode = "precise"                  # precise | fast
term_policy = "warn"              # off | warn | enforce
remote_fallback = "disabled"      # disabled | on-local-unavailable | on-local-failure
# preferred_backend = "remote"    # 可选；不写时 CLI 用第一个启用的后端
max_input_chars = 20000
strict_integrity = true           # 产品必须为 true
timeout_ms = 30000

[cache]
capacity = 256
