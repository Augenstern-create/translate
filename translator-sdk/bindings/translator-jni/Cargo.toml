[package]
name = "translator-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "P6: Android/Java 绑定层（JNI cdylib），只做适配，不含业务逻辑"
publish = false

[features]
default = []
# 透传开关：Android 上默认都不开（没有已验证的 NMT 后端，见 docs/36）
nmt-bergamot = ["translator-api/nmt-bergamot"]
nmt-ort = ["translator-api/nmt-ort"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 绑定层唯一允许的依赖方向：jni → translator-api（绝不反向，见 docs/39 §1.4）
translator-api = { workspace = true, features = ["mocks", "dictionary", "rules", "resource"] }
translator-types.workspace = true
translator-resource.workspace = true
serde_json.workspace = true
pollster.workspace = true
jni = "0.21"
