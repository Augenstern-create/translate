[workspace]
resolver = "2"
members = [
    "crates/translator-types",
    "crates/translator-plugin-api",
    "crates/translator-http",
    "crates/translator-core",
    "crates/translator-api",
    "crates/translator-dictionary",
    "crates/translator-rules",
    "tools/pack-dictionary",
    "tools/quality-runner",
    "tools/eval-import",
    "apps/translator-cli",
]

[workspace.package]
version = "0.2.0-rc.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
# 内部 crate 一律不发布：仓库 URL 还是占位符，且 path 依赖无法 package（详见 docs/21）
publish = false
authors = ["translator-sdk contributors"]
repository = "https://github.com/Augenstern-create/translate"

[workspace.dependencies]
# 内部 crate：一律走 path 依赖，禁止出现版本号，避免发布时漂移
translator-types = { path = "crates/translator-types" }
translator-plugin-api = { path = "crates/translator-plugin-api" }
translator-http = { path = "crates/translator-http" }
translator-core = { path = "crates/translator-core" }
translator-api = { path = "crates/translator-api" }
translator-dictionary = { path = "crates/translator-dictionary" }
translator-rules = { path = "crates/translator-rules" }
pack-dictionary = { path = "tools/pack-dictionary" }
quality-runner = { path = "tools/quality-runner" }

# 外部依赖（P1 新增，全部为轻量或按 feature 隔离）
pollster = "0.4"                  # 仅 CLI / 测试：同步驱动 async
fst = "0.4"                       # 词典索引（mmap 友好）
rusqlite = { version = "0.32", features = ["bundled"] }  # 释义存储（自带 SQLite，免系统依赖）
memmap2 = "0.9"                   # 只读 mmap
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
sha2 = "0.10"                    # 资源包校验和（设计文档 §9 要求）
tempfile = "3"
toml = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
