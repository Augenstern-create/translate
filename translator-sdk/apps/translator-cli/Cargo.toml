[package]
name = "translator-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# 真实本地 NMT（P3.1-E）。默认关闭：默认构建出的二进制依旧不依赖任何模型/进程代码。
nmt = ["translator-api/nmt-bergamot"]

[[bin]]
name = "translator-cli"
path = "src/main.rs"

[dependencies]
# 注意：CLI 启用 mocks feature，因此这个二进制**完全不需要任何真实模型**
translator-api = { workspace = true, features = ["mocks", "dictionary", "rules", "resource"] }
translator-types.workspace = true
translator-resource.workspace = true
translator-plugin-api = { workspace = true, features = ["mocks"] }
pollster.workspace = true
